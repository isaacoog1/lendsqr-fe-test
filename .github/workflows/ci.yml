name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same four commands that gate a commit locally.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

      # The committed dataset must match what the generator produces, so a
      # hand-edit to public/api/users.json cannot drift from the script.
      - name: Verify the mock dataset is reproducible
        run: |
          npm run generate:users
          git diff --exit-code -- public/api/users.json
